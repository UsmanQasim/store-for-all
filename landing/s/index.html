<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pay &amp; visit this shop — Dukaan</title>
  <meta name="description" content="Payment details and booking for a local shop on Dukaan." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B6E4F" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    body { min-height: 100dvh; }
    .shell { width: min(100% - 32px, 520px); margin: 0 auto; padding: 24px 0 48px; display: grid; gap: 16px; }
    .head { text-align: center; display: grid; justify-items: center; gap: 6px; }
    .logo-img { width: 88px; height: 88px; border-radius: 22px; object-fit: cover; background: var(--primary-soft); display: grid; place-items: center; font-size: 2rem; font-weight: 800; color: var(--primary); }
    .method { display: grid; gap: 10px; }
    .method h3 { margin: 0; display: flex; gap: 8px; align-items: center; }
    .badge { font-size: .7rem; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
    .copy { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 12px; border: 0; background: var(--surface-alt); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .copy small { display: block; font-size: .7rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
    .copy b { display: block; letter-spacing: .04em; word-break: break-all; }
    .copy .act { margin-left: auto; color: var(--primary); font-weight: 700; font-size: .85rem; flex: none; }
    .qr-img { width: 220px; margin: 4px auto 0; border-radius: 12px; background: #fff; }
    .warn { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
    .skeleton { height: 120px; border-radius: 16px; background: var(--surface-alt); }
    .actions { display: grid; gap: 10px; }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </main>

  <template id="method-tpl">
    <article class="card method">
      <h3><span data-type></span><span class="badge" data-primary hidden>Primary</span></h3>
      <div data-fields></div>
      <p class="muted" data-note hidden style="margin:0;font-size:.9rem"></p>
      <img class="qr-img" data-qr alt="" hidden loading="lazy" />
    </article>
  </template>

  <script src="/assets/config.js"></script>
  <script type="module">
    const C = window.DUKAAN;
    const LABELS = { jazzcash: 'JazzCash', easypaisa: 'Easypaisa', sadapay: 'SadaPay', nayapay: 'NayaPay', raast: 'Raast', bank_account: 'Bank transfer', upi: 'UPI', paypal: 'PayPal', wise: 'Wise', other: 'Other' };
    const app = document.getElementById('app');
    const slug = (location.pathname.match(/\/s\/([a-z0-9-]{3,64})/i) || [])[1]?.toLowerCase() || new URLSearchParams(location.search).get('slug');

    const el = (tag, props = {}, ...children) => {
      const n = Object.assign(document.createElement(tag), props);
      for (const c of children) n.append(c);
      return n;
    };

    async function rest(path) {
      const res = await fetch(`${C.supabaseUrl}/rest/v1/${path}`, { headers: { apikey: C.supabaseAnonKey, Authorization: `Bearer ${C.supabaseAnonKey}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function copyField(label, value) {
      const act = el('span', { className: 'act', textContent: 'Copy' });
      const btn = el('button', { className: 'copy', type: 'button' }, el('span', {}, el('small', { textContent: label.toUpperCase() }), el('b', { textContent: value })), act);
      btn.setAttribute('aria-label', `Copy ${label}: ${value}`);
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(value); act.textContent = 'Copied ✓'; setTimeout(() => (act.textContent = 'Copy'), 1500); } catch { /* clipboard blocked */ }
      });
      return btn;
    }

    function openInApp() {
      const isAndroid = /android/i.test(navigator.userAgent);
      // intent:// falls back to the Play Store automatically when the app isn't installed.
      return isAndroid
        ? `intent://s/${slug}#Intent;scheme=${C.scheme};package=${C.androidPackage};S.browser_fallback_url=${encodeURIComponent(C.playStoreUrl)};end`
        : `${C.scheme}://s/${slug}`;
    }

    function notFound(msg) {
      app.replaceChildren(
        el('div', { className: 'head' }, el('h1', { textContent: msg }), el('p', { className: 'muted', textContent: 'The QR code may be old or the shop is no longer listed.' })),
        el('a', { className: 'btn btn-primary', href: '/', textContent: 'Go to Dukaan' }),
      );
    }

    async function main() {
      if (!slug) return notFound('Shop not found');
      try {
        const [shop] = await rest(`shops?slug=eq.${encodeURIComponent(slug)}&select=id,name,tagline,logo_url,area,city,rating_avg,rating_count,accepts_bookings,accepts_orders&limit=1`);
        if (!shop) return notFound('Shop not found');
        document.title = `Pay ${shop.name} — ${C.brand}`;
        const methods = await rest(`shop_payment_methods?shop_id=eq.${shop.id}&select=type,account_title,account_number,iban,bank_name,qr_image_url,note,is_primary&order=is_primary.desc,sort.asc`);

        const logo = shop.logo_url ? el('img', { className: 'logo-img', src: shop.logo_url, alt: '' }) : el('div', { className: 'logo-img', textContent: shop.name[0] || '?' });
        const meta = [shop.area, shop.city].filter(Boolean).join(', ');
        const rating = shop.rating_count ? `★ ${Number(shop.rating_avg).toFixed(1)} (${shop.rating_count})` : '';
        const head = el('header', { className: 'head' }, logo, el('h1', { textContent: shop.name, style: 'font-size:1.9rem;margin:6px 0 0' }), el('p', { className: 'muted', style: 'margin:0', textContent: [shop.tagline, meta, rating].filter(Boolean).join(' · ') }));

        const tpl = document.getElementById('method-tpl');
        const cards = methods.map((m) => {
          const node = tpl.content.cloneNode(true);
          node.querySelector('[data-type]').textContent = LABELS[m.type] + (m.bank_name ? ` · ${m.bank_name}` : '');
          if (m.is_primary) node.querySelector('[data-primary]').hidden = false;
          const f = node.querySelector('[data-fields]');
          f.style.cssText = 'display:grid;gap:8px';
          f.append(copyField('Account title', m.account_title));
          if (m.account_number) f.append(copyField('Account / mobile number', m.account_number));
          if (m.iban) f.append(copyField('IBAN', m.iban));
          if (m.note) Object.assign(node.querySelector('[data-note]'), { hidden: false, textContent: m.note });
          if (m.qr_image_url) Object.assign(node.querySelector('[data-qr]'), { hidden: false, src: m.qr_image_url, alt: `${LABELS[m.type]} QR code` });
          return node;
        });

        const payTitle = el('h2', { textContent: 'Pay this shop', style: 'font-size:1.3rem;margin:8px 0 0' });
        const payIntro = el('p', { className: 'muted', style: 'margin:0', textContent: 'Send money directly from your wallet or bank app. Dukaan never handles your money.' });
        const none = el('p', { className: 'card muted', textContent: 'This shop hasn’t added payment details yet.' });
        const warn = el('p', { className: 'warn', textContent: '🛡️ Always confirm the account title matches the shop before sending money.' });

        const features = [shop.accepts_bookings && 'book a seat', shop.accepts_orders && 'pre-order', 'save it to your home screen'].filter(Boolean).join(', ');
        const actions = el('div', { className: 'actions' },
          el('a', { className: 'btn btn-primary', href: openInApp(), textContent: 'Open in the Dukaan app' }),
          el('a', { className: 'btn btn-secondary', href: C.playStoreUrl, textContent: 'Get the app — free' }),
          el('p', { className: 'muted', style: 'text-align:center;font-size:.9rem;margin:0', textContent: `In the app you can ${features}.` }),
        );

        app.replaceChildren(head, payTitle, payIntro, ...(cards.length ? cards : [none]), warn, actions);
      } catch (e) {
        notFound('Couldn’t load this shop');
      }
    }
    main();
  </script>
</body>
</html>
